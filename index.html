<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="To Do">
<meta name="theme-color" content="#f4f1ea">
<title>Things To Do</title>
<style>
  :root {
    --bg: #f4f1ea;
    --paper: #fffdf8;
    --ink: #2b2824;
    --muted: #a39d91;
    --line: #e7e2d6;
    --accent: #c8553d;
    --done: #b7b1a4;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: contain;
    padding:
      calc(env(safe-area-inset-top) + 28px)
      calc(env(safe-area-inset-right) + 22px)
      0
      calc(env(safe-area-inset-left) + 22px);
    min-height: 100%;
  }

  .sheet {
    width: 100%;
    max-width: 560px;
    margin: 0 auto;
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 18px;
    padding-bottom: 14px;
    border-bottom: 2px solid var(--ink);
  }

  h1 { font-size: 32px; font-weight: 600; letter-spacing: -0.5px; }

  .count {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 0.5px;
  }

  ul {
    list-style: none;
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  /* row is a window; .inner slides left to reveal delete */
  li {
    position: relative;
    overflow: hidden;
    border-bottom: 1px solid var(--line);
  }

  li .inner {
    position: relative;
    display: flex;
    align-items: flex-start;
    gap: 16px;
    padding: 17px 4px;
    background: var(--bg);
    transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    touch-action: pan-y;
    will-change: transform;
  }

  li .box {
    flex: 0 0 auto;
    width: 26px;
    height: 26px;
    margin-top: 1px;
    border: 2px solid var(--ink);
    border-radius: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.18s ease;
  }
  li .box svg { width: 15px; height: 15px; opacity: 0; transition: opacity 0.15s ease; }
  li .box svg path { stroke: var(--paper); stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }

  li .text {
    flex: 1;
    font-size: 20px;
    line-height: 1.42;
    word-break: break-word;
  }

  li.done .box { background: var(--ink); }
  li.done .box svg { opacity: 1; }
  li.done .text { color: var(--done); text-decoration: line-through; text-decoration-thickness: 1px; }

  /* checking an item plays this, then the row is removed */
  li.removing {
    max-height: 0 !important;
  }
  li.removing .inner {
    opacity: 0;
    transform: translateX(40px) !important;
    transition: opacity 0.3s ease, transform 0.3s ease;
  }
  li {
    max-height: 160px;
    transition: max-height 0.3s ease 0.05s;
  }

  /* actions sit behind the sliding row */
  li .actions {
    position: absolute;
    top: 0; right: 0; bottom: 0;
    display: flex;
    z-index: 0;
  }
  li .actions button {
    width: 80px;
    border: none;
    color: #fff;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 15px;
    letter-spacing: 0.5px;
    cursor: pointer;
  }
  li .actions .edit { background: #6b7d6a; }
  li .actions .del { background: var(--accent); }
  li .inner { z-index: 1; }

  /* inline editing */
  li .text.editing {
    outline: none;
    border-bottom: 2px solid var(--accent);
    padding-bottom: 2px;
    -webkit-user-select: text;
    user-select: text;
  }

  .add {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px 4px;
    border-top: 1px solid var(--line);
    background: var(--bg);
    margin-bottom: calc(env(safe-area-inset-bottom) + 60px);
  }

  .add.hidden { display: none; }

  .full {
    display: none;
    flex: 0 0 auto;
    color: var(--muted);
    font-style: italic;
    font-size: 17px;
    padding: 20px 4px;
    border-top: 1px solid var(--line);
    text-align: center;
    margin-bottom: calc(env(safe-area-inset-bottom) + 60px);
  }
  .full.show { display: block; }

  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(env(safe-area-inset-bottom) + 72px);
    transform: translate(-50%, 20px);
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--ink);
    color: var(--paper);
    padding: 13px 16px 13px 20px;
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.22);
    font-size: 16px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.22s ease, transform 0.22s ease;
    z-index: 10;
    max-width: calc(100vw - 44px);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }

  .toast button {
    border: none;
    background: none;
    color: #f0a58f;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.5px;
    cursor: pointer;
    padding: 4px 6px;
  }

  .add .plus {
    width: 26px; height: 26px;
    flex: 0 0 auto;
    color: var(--muted);
    font-size: 28px;
    line-height: 24px;
    text-align: center;
  }

  .add input {
    flex: 1;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 20px; /* >=16px prevents iOS zoom-on-focus */
    color: var(--ink);
    padding: 2px 0;
  }
  .add input::placeholder { color: var(--muted); font-style: italic; }
  .add input:focus { outline: none; }

  .empty {
    color: var(--muted);
    font-style: italic;
    font-size: 19px;
    padding: 32px 4px;
    text-align: center;
  }
</style>
</head>
<body>
  <main class="sheet">
    <header>
      <h1>To Do</h1>
      <span class="count" id="count"></span>
    </header>
    <ul id="list"></ul>
    <div class="add" id="add">
      <span class="plus">+</span>
      <input id="input" type="text" placeholder="Add something…" autocomplete="off"
             autocapitalize="sentences" enterkeyhint="done">
    </div>
    <div class="full" id="full">List full — finish or remove one to add another.</div>
  </main>

  <div class="toast" id="toast" aria-live="polite">
    <span id="toastMsg">Item cleared</span>
    <button id="undoBtn">Undo</button>
  </div>

<script>
  const KEY = 'dia-simple-todos';
  const MAX = 3;
  const listEl = document.getElementById('list');
  const inputEl = document.getElementById('input');
  const countEl = document.getElementById('count');
  const addEl = document.getElementById('add');
  const fullEl = document.getElementById('full');
  const toastEl = document.getElementById('toast');
  const toastMsg = document.getElementById('toastMsg');
  const undoBtn = document.getElementById('undoBtn');

  let todos = load();

  function load() {
    try { return JSON.parse(localStorage.getItem(KEY)) || []; }
    catch { return []; }
  }
  function save() { localStorage.setItem(KEY, JSON.stringify(todos)); }

  // --- undo for the last removed item ---
  let lastRemoved = null;       // { item, index }
  let toastTimer = null;

  function removeAt(index, msg) {
    lastRemoved = { item: todos[index], index };
    todos.splice(index, 1);
    save(); render();
    showUndo(msg || 'Item cleared');
  }

  function showUndo(msg) {
    toastMsg.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideUndo, 5000);
  }
  function hideUndo() {
    toastEl.classList.remove('show');
    lastRemoved = null;
  }
  undoBtn.addEventListener('click', () => {
    if (!lastRemoved) return;
    if (todos.length >= MAX) { hideUndo(); return; }
    const at = Math.min(lastRemoved.index, todos.length);
    todos.splice(at, 0, lastRemoved.item);
    lastRemoved = null;
    clearTimeout(toastTimer);
    toastEl.classList.remove('show');
    save(); render();
  });

  const check = '<svg viewBox="0 0 16 16"><path d="M3 8.5l3 3 7-7"/></svg>';
  const REVEAL = 160; // px the row slides to show Edit + Delete

  function render() {
    listEl.innerHTML = '';
    if (todos.length === 0) {
      const d = document.createElement('div');
      d.className = 'empty';
      d.textContent = 'Nothing yet. Add your first thing below.';
      listEl.appendChild(d);
    } else {
      todos.forEach((t, i) => {
        const li = document.createElement('li');
        if (t.done) li.classList.add('done');

        const actions = document.createElement('div');
        actions.className = 'actions';
        const editBtn = document.createElement('button');
        editBtn.className = 'edit';
        editBtn.textContent = 'Edit';
        const del = document.createElement('button');
        del.className = 'del';
        del.textContent = 'Delete';
        actions.append(editBtn, del);

        const inner = document.createElement('div');
        inner.className = 'inner';

        const box = document.createElement('span');
        box.className = 'box';
        box.innerHTML = check;

        const text = document.createElement('span');
        text.className = 'text';
        text.textContent = t.text;

        inner.append(box, text);
        li.append(actions, inner);

        setupRow(li, inner, editBtn, del, text, i);
        listEl.appendChild(li);
      });
    }
    const left = todos.filter(t => !t.done).length;
    countEl.textContent = todos.length ? `${left} left` : '';

    const atMax = todos.length >= MAX;
    addEl.classList.toggle('hidden', atMax);
    fullEl.classList.toggle('show', atMax);
  }

  // tap to complete (checks, then auto-erases); swipe left to reveal Edit + Delete
  function setupRow(li, inner, editBtn, del, text, i) {
    let startX = 0, startY = 0, open = false, dragging = false, decided = false, horizontal = false;
    let editing = false, removing = false;
    const item = todos[i];

    const close = () => { open = false; inner.style.transform = 'translateX(0)'; };
    const openRow = () => { open = true; inner.style.transform = `translateX(-${REVEAL}px)`; };

    // show the checkmark briefly, then slide the row out and drop it
    function complete() {
      if (removing) return;
      removing = true;
      li.classList.add('done');
      setTimeout(() => {
        li.classList.add('removing');
        setTimeout(() => {
          const idx = todos.indexOf(item);
          if (idx !== -1) removeAt(idx, 'Item cleared');
          else { save(); render(); }
        }, 320);
      }, 240);
    }

    function beginEdit() {
      editing = true;
      close();
      text.classList.add('editing');
      text.setAttribute('contenteditable', 'true');
      text.focus();
      // place caret at end
      const r = document.createRange();
      r.selectNodeContents(text);
      r.collapse(false);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(r);
    }

    function commitEdit() {
      if (!editing) return;
      editing = false;
      text.removeAttribute('contenteditable');
      text.classList.remove('editing');
      const v = text.textContent.trim();
      if (v) { todos[i].text = v; save(); }
      render(); // re-sync (also restores empty text if blanked)
    }

    text.addEventListener('keydown', (e) => {
      if (!editing) return;
      if (e.key === 'Enter') { e.preventDefault(); text.blur(); }
    });
    text.addEventListener('blur', commitEdit);

    editBtn.addEventListener('click', (e) => { e.stopPropagation(); beginEdit(); });
    del.addEventListener('click', (e) => {
      e.stopPropagation();
      const idx = todos.indexOf(item);
      if (idx !== -1) removeAt(idx, 'Item deleted');
    });

    inner.addEventListener('touchstart', (e) => {
      if (editing) return;
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
      dragging = true; decided = false; horizontal = false;
      inner.style.transition = 'none';
    }, { passive: true });

    inner.addEventListener('touchmove', (e) => {
      if (!dragging || editing) return;
      const dx = e.touches[0].clientX - startX;
      const dy = e.touches[0].clientY - startY;
      if (!decided) {
        if (Math.abs(dx) > 8 || Math.abs(dy) > 8) {
          decided = true;
          horizontal = Math.abs(dx) > Math.abs(dy);
        }
      }
      if (horizontal) {
        const base = open ? -REVEAL : 0;
        let x = base + dx;
        x = Math.max(-REVEAL - 20, Math.min(0, x));
        inner.style.transform = `translateX(${x}px)`;
      }
    }, { passive: true });

    inner.addEventListener('touchend', (e) => {
      if (editing) return;
      dragging = false;
      inner.style.transition = '';
      if (horizontal) {
        const dx = e.changedTouches[0].clientX - startX;
        if (open) { (dx > REVEAL / 3) ? close() : openRow(); }
        else { (dx < -REVEAL / 3) ? openRow() : close(); }
      } else if (!decided) {
        if (open) { close(); }
        else { complete(); }
      }
    });

    // mouse/desktop fallback: click completes, double-click edits
    inner.addEventListener('click', (e) => {
      if ('ontouchstart' in window || editing) return;
      if (open) { close(); return; }
      complete();
    });
    inner.addEventListener('dblclick', (e) => {
      if ('ontouchstart' in window) return;
      e.preventDefault();
      beginEdit();
    });
  }

  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      const v = inputEl.value.trim();
      if (!v) return;
      if (todos.length >= MAX) return;
      todos.unshift({ text: v, done: false });
      inputEl.value = '';
      save(); render();
    }
  });

  render();
</script>
</body>
</html>
